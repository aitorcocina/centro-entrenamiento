name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping cuaderno_kv en Supabase
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://bzjzedwbahgitunoksps.supabase.co/rest/v1/cuaderno_kv?select=key&limit=1" \
            -H "apikey: sb_publishable_GwXGrJorusdd94VeHBH4Lg_C657Knj5" \
            -H "Authorization: Bearer sb_publishable_GwXGrJorusdd94VeHBH4Lg_C657Knj5"

      - name: Registrar actividad (evita que GitHub desactive el cron a los 60 dias)
        run: |
          mkdir -p .github
          echo "Ultimo ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keep-alive-log.txt
          git config user.name "keep-alive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keep-alive-log.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +'%Y-%m-%d')"
          git push
